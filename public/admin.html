<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>إدارة Promotion Dizad</title>
<link rel="stylesheet" href="/styles.css">
<style>
  .admin-wrap{max-width:1100px;margin:0 auto;padding:18px 14px 60px}
  .atabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:20}
  .atab{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
  .atab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  .login-box{max-width:420px;margin:9vh auto}
  .pd-logo{width:64px;height:64px;border-radius:16px;background:linear-gradient(180deg,#143656,#081a2c);border:2px solid #c9a227;color:#e3c04a;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;margin:0 auto 10px}
  details.order-det{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--surface)}
</style>
</head>
<body>
<div class="admin-wrap">

  <div id="adminLogin" class="login-box" hidden>
    <div class="pd-logo">PD</div>
    <div class="card">
      <h2 style="text-align:center">واجهة إدارة Promotion Dizad</h2>
      <p class="muted" style="text-align:center">صفحة خاصة بصاحب المنصة فقط — لا تظهر في التطبيق العام.</p>
      <form id="aLoginForm" class="stack">
        <input id="aPhone" placeholder="رقم هاتف المدير" autocomplete="username" required>
        <input id="aPass" type="password" placeholder="كلمة المرور" autocomplete="current-password" required>
        <button class="btn gold big" type="submit">دخول الإدارة</button>
      </form>
      <p class="muted small" id="aLoginErr" style="color:var(--danger)"></p>
    </div>
  </div>

  <div id="adminApp" hidden>
    <div class="drawer-head">
      <h2>🛠 إدارة Promotion Dizad</h2>
      <span><span class="muted" id="aWho"></span> <button class="btn small light" id="aLogout" type="button">خروج</button></span>
    </div>
    <nav class="atabs" id="aTabs">
      <button class="atab active" data-atab="overview" type="button">📊 نظرة عامة</button>
      <button class="atab" data-atab="reviews" type="button">✅ المراجعات والاعتماد</button>
      <button class="atab" data-atab="products" type="button">📦 المنتجات</button>
      <button class="atab" data-atab="users" type="button">👥 المستخدمون</button>
      <button class="atab" data-atab="orders" type="button">🧾 الطلبات</button>
      <button class="atab" data-atab="settlements" type="button">💰 التسويات</button>
      <button class="atab" data-atab="integrations" type="button">🔌 التكاملات والإشعارات</button>
      <button class="atab" data-atab="support" type="button">✉️ الدعم</button>
      <button class="atab" data-atab="tools" type="button">🧰 أدوات</button>
    </nav>
    <div id="aContent"><p class="muted">جارٍ التحميل…</p></div>
  </div>

</div>
<div id="toast" class="toast" hidden></div>

<script>
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => (Number(n) || 0).toLocaleString('fr-DZ') + ' دج';
let CSRF = null;
function toast(msg, isErr) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  t.style.background = isErr ? '#c0392b' : '#0b2239';
  setTimeout(() => { t.hidden = true; }, 3400);
}
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (CSRF && (opts.method || 'GET') !== 'GET') headers['x-csrf'] = CSRF;
  const res = await fetch(path, { ...opts, headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('خطأ ' + res.status));
  if (data.csrf) CSRF = data.csrf;
  return data;
}

let TAB = 'overview';
async function render() {
  const box = $('#aContent');
  $$('#aTabs .atab').forEach((t) => t.classList.toggle('active', t.dataset.atab === TAB));
  try {
    if (TAB === 'overview') return renderOverview(box);
    if (TAB === 'reviews') return renderReviews(box);
    if (TAB === 'products') return renderProducts(box);
    if (TAB === 'users') return renderUsers(box);
    if (TAB === 'orders') return renderOrders(box);
    if (TAB === 'settlements') return renderSettlements(box);
    if (TAB === 'integrations') return renderIntegrations(box);
    if (TAB === 'support') return renderSupport(box);
    if (TAB === 'tools') return renderTools(box);
  } catch (e) { box.innerHTML = '<p class="muted">تعذر التحميل: ' + esc(e.message) + '</p>'; }
}
$$('#aTabs .atab').forEach((t) => t.addEventListener('click', () => { TAB = t.dataset.atab; render(); }));

async function renderOverview(box) {
  const ov = await api('/api/admin/overview');
  box.innerHTML = `
  <div class="stat-grid">
    <div class="stat">أرباح المنصة المثبتة<b>${fmt(ov.platformEarned)}</b></div>
    <div class="stat">عمولات مستحقة للمسوقين<b>${fmt(ov.marketerDue)}</b></div>
    <div class="stat">موردون بانتظار المراجعة<b>${ov.pendingSuppliers}</b></div>
    <div class="stat">منتجات بانتظار الاعتماد<b>${ov.pendingProducts}</b></div>
    <div class="stat">إشعارات فاشلة/غير مضبوطة<b>${ov.failedNotifications}</b></div>
    <div class="stat">طلبات متأخرة (+48 سا)<b>${ov.lateOrders.length}</b></div>
  </div>
  <div class="card"><h3>مستخدمون حسب الدور</h3>${Object.entries(ov.usersByRole || {}).map(([k, v]) => `<p>${esc(k)}: <strong>${v}</strong></p>`).join('')}</div>
  <div class="card"><h3>طلبات حسب الحالة</h3>${Object.entries(ov.ordersByStatus || {}).map(([k, v]) => `<p>${esc(k)}: <strong>${v}</strong></p>`).join('') || '<p class="muted">لا طلبات بعد.</p>'}</div>
  ${ov.lateOrders.length ? `<div class="card"><h3>⚠️ طلبات متأخرة</h3>${ov.lateOrders.map((o) => `<p>${esc(o.ref)} — ${esc(o.status)} — منذ ${new Date(o.created_at).toLocaleString('ar-DZ')}</p>`).join('')}</div>` : ''}`;
}

async function renderReviews(box) {
  const [users, products] = await Promise.all([api('/api/admin/users'), api('/api/admin/products')]);
  const pendingSup = users.users.filter((u) => u.role === 'supplier' && u.status === 'pending');
  const pendingProd = products.products.filter((p) => p.status === 'pending_review');
  box.innerHTML = `
  <div class="card"><h3>مراجعة الموردين</h3>${pendingSup.length ? pendingSup.map((u) => `
    <p><strong>${esc(u.name)}</strong> — ${esc(u.business_name || '')} — ${esc(u.phone)} — ${esc(u.activity || '')}
    <button class="btn small" data-uact="approve" data-uid="${u.id}">تفعيل</button>
    <button class="btn small danger" data-uact="reject" data-uid="${u.id}">رفض</button></p>`).join('') : '<p class="muted">لا موردين بانتظار المراجعة.</p>'}</div>
  <div class="card"><h3>اعتماد المنتجات وتحديد الهامش والعمولة</h3>${pendingProd.length ? pendingProd.map((p) => `
    <p><strong>${esc(p.name)}</strong> — المورد: ${esc(p.supplier_name)} — الجملة: ${fmt(p.wholesale_price)} — المخزون: ${p.stock}<br>
    هامش المنصة <input type="number" id="mg-${p.id}" value="500" style="width:100px"> عمولة المسوق <input type="number" id="cm-${p.id}" value="200" style="width:100px">
    <button class="btn small gold" data-papprove="${p.id}">اعتماد</button>
    <button class="btn small danger" data-preject="${p.id}">رفض</button></p>`).join('') : '<p class="muted">لا منتجات بانتظار الاعتماد.</p>'}</div>`;
  wireUserActions(box); wireProductReviews(box);
}

async function renderProducts(box) {
  const { products } = await api('/api/admin/products');
  box.innerHTML = `<div class="card"><h3>كل المنتجات (${products.length})</h3><div class="tablewrap"><table>
    <tr><th>المنتج</th><th>المورد</th><th>الحالة</th><th>الجملة</th><th>الهامش</th><th>العمولة</th><th>سعر الزبون</th><th>صافي المنصة</th><th>المخزون</th></tr>
    ${products.map((p) => `<tr><td>${esc(p.name)}</td><td>${esc(p.supplier_name)}</td><td>${esc(p.status)}</td><td>${fmt(p.wholesale_price)}</td><td>${fmt(p.platform_margin)}</td><td>${fmt(p.marketer_commission)}</td><td>${fmt(p.customer_price)}</td><td>${fmt(p.platform_net)}</td><td>${p.stock}</td></tr>`).join('')}
  </table></div></div>`;
}

function userRow(u) {
  return `<tr><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td>${esc(u.phone)}</td>
  <td>${u.email ? esc(u.email) + (u.email_verified ? ' <span class="badge">مؤكد ✅</span>' : ' <span class="badge out">غير مؤكد</span>') : '<span class="muted">—</span>'}</td><td>${esc(u.status)}</td>
  <td>${u.email && !u.email_verified ? `<button class="btn small gold" data-verify-user="${u.id}">تأكيد البريد يدوياً</button> ` : ''}${u.status === 'suspended' ? `<button class="btn small" data-uact="activate" data-uid="${u.id}">إعادة تفعيل</button>` : `<button class="btn small light" data-uact="suspend" data-uid="${u.id}">تعليق</button>`}</td></tr>`;
}
function wireUserActions(box) {
  $$('[data-verify-user]', box).forEach((b) => b.addEventListener('click', async () => {
    try { await api(`/api/admin/users/${b.dataset.verifyUser}/verify-email`, { method: 'POST', body: {} }); toast('تم تأكيد بريد المستخدم'); render(); }
    catch (e) { toast(e.message, true); }
  }));
  $$('[data-uact]', box).forEach((b) => b.addEventListener('click', async () => {
    let reason = null;
    if (b.dataset.uact === 'reject') { reason = prompt('سبب الرفض:'); if (reason === null) return; }
    try { await api(`/api/admin/users/${b.dataset.uid}/action`, { method: 'POST', body: { action: b.dataset.uact, reason } }); toast('تم'); render(); }
    catch (e) { toast(e.message, true); }
  }));
}
function wireProductReviews(box) {
  $$('[data-papprove]', box).forEach((b) => b.addEventListener('click', async () => {
    const id = b.dataset.papprove;
    try { await api(`/api/admin/products/${id}/review`, { method: 'POST', body: { action: 'approve', platformMargin: Number($('#mg-' + id).value), marketerCommission: Number($('#cm-' + id).value) } }); toast('تم اعتماد المنتج'); render(); }
    catch (e) { toast(e.message, true); }
  }));
  $$('[data-preject]', box).forEach((b) => b.addEventListener('click', async () => {
    const reason = prompt('سبب رفض المنتج:'); if (reason === null) return;
    try { await api(`/api/admin/products/${b.dataset.preject}/review`, { method: 'POST', body: { action: 'reject', reason } }); toast('رُفض المنتج'); render(); }
    catch (e) { toast(e.message, true); }
  }));
}

async function renderUsers(box) {
  const { users } = await api('/api/admin/users');
  box.innerHTML = `<div class="card"><h3>المستخدمون</h3>
    <input id="aUserQ" type="search" placeholder="🔍 ابحث بالاسم أو الهاتف أو البريد…" style="margin-bottom:10px">
    <div class="tablewrap"><table id="aUsersTable"><tr><th>الاسم</th><th>الدور</th><th>الهاتف</th><th>البريد وتأكيده</th><th>الحالة</th><th></th></tr>
    ${users.filter((u) => u.role !== 'admin').map(userRow).join('')}</table></div></div>`;
  wireUserActions(box);
  $('#aUserQ').addEventListener('input', (e) => {
    const q = e.target.value.trim();
    $$('#aUsersTable tr').forEach((tr, i) => { if (i > 0) tr.style.display = !q || tr.textContent.includes(q) ? '' : 'none'; });
  });
}

async function renderOrders(box) {
  const { orders } = await api('/api/admin/orders');
  box.innerHTML = `<div class="card"><h3>كل الطلبات (${orders.length})</h3>
    <input id="aOrderQ" type="search" placeholder="🔍 ابحث برقم الطلبية…" style="margin-bottom:10px">
    <div id="aOrdersList">${orders.slice(0, 80).map((o) => `
    <details class="order-det"><summary><strong>${esc(o.ref)}</strong> — ${esc(o.status_label)} — ${fmt(o.total)} — مورد #${o.supplier_id} — ${o.marketer_id ? 'مسوق #' + o.marketer_id + ' (' + esc(o.ref_code || '') + ')' : 'مباشر'}
      <button class="btn small light" data-odetails="${o.id}" type="button">📋 التفاصيل الكاملة</button></summary><div id="odet-${o.id}"><p class="muted">اضغط «التفاصيل الكاملة» للعرض.</p></div></details>`).join('') || '<p class="muted">لا طلبات بعد.</p>'}</div></div>`;
  $('#aOrderQ').addEventListener('input', (e) => {
    const q = e.target.value.trim();
    $$('#aOrdersList details').forEach((d) => { d.style.display = !q || d.textContent.includes(q) ? '' : 'none'; });
  });
  $$('[data-odetails]', box).forEach((b) => b.addEventListener('click', async () => {
    const id = b.dataset.odetails, target = $('#odet-' + id);
    try {
      const d = await api('/api/orders/' + id + '/details');
      const o = d.order;
      target.innerHTML = `
        <p>المشتري: <strong>${esc(o.buyer_name || '')}</strong> — ${esc(o.buyer_phone || '')}<br>
        الولاية: ${esc(o.wilaya_name)} · البلدية: ${esc(o.commune)} · العنوان: ${esc(o.address || '')}<br>
        أُنشئت: ${new Date(o.created_at).toLocaleString('ar-DZ')}</p>
        <div class="tablewrap"><table><tr><th>المنتج</th><th>الكمية</th><th>سعر الزبون</th><th>الجملة</th><th>الهامش</th><th>العمولة</th></tr>
        ${d.items.map((i) => `<tr><td>${esc(i.name)}${i.size ? ' · ' + esc(i.size) : ''}${i.color ? ' · ' + esc(i.color) : ''}</td><td>${i.qty}</td><td>${fmt(i.customer_price)}</td><td>${fmt(i.wholesale_price || 0)}</td><td>${fmt(i.platform_margin || 0)}</td><td>${fmt(i.marketer_commission || 0)}</td></tr>`).join('')}</table></div>
        <p>مجموع المنتجات: ${fmt(o.subtotal)} · التوصيل: ${fmt(o.delivery_fee)} · <strong>الإجمالي: ${fmt(o.total)}</strong><br>
        مجموع الجملة: ${fmt(o.wholesale_total || 0)} · هامش المنصة: ${fmt(o.margin_total || 0)} · عمولات: ${fmt(o.commission_total || 0)} · <strong>صافي المنصة: ${fmt(o.platform_net || 0)}</strong></p>
        <p class="muted">المورد: ${esc(o.supplier ? (o.supplier.business_name || o.supplier.name) : '')} · المسوق: ${o.marketer ? esc(o.marketer.name) : 'بيع مباشر'}</p>
        ${d.history.map((h) => `<p class="small">${new Date(h.created_at).toLocaleString('ar-DZ')} — ${esc(h.label)}${h.note ? ' · ' + esc(h.note) : ''}</p>`).join('')}`;
    } catch (e) { target.innerHTML = '<p class="muted">' + esc(e.message) + '</p>'; }
  }));
}

async function renderSettlements(box) {
  const { settlements } = await api('/api/admin/settlements');
  box.innerHTML = `<div class="card"><h3>تسويات المسوقين</h3>${settlements.length ? settlements.map((s) => `
    <p>#${s.id} — ${esc(s.marketer_name)} — ${fmt(s.amount)} — ${esc(s.state)}${s.marketer_payment_method ? `<br><span class="muted small">💳 طريقة دفع المسوق: ${esc(s.marketer_payment_method)} — ${esc(s.marketer_payment_details || '')}</span>` : ''} ${s.state === 'requested' || s.state === 'approved' ? `
    <input placeholder="طريقة الدفع" id="sm-${s.id}" style="width:110px"> <input placeholder="المرجع" id="sr-${s.id}" style="width:110px">
    <button class="btn small gold" data-spaid="${s.id}">تأكيد الدفع الفعلي</button> <button class="btn small danger" data-sreject="${s.id}">رفض</button>` : ''}</p>`).join('') : '<p class="muted">لا طلبات تسوية.</p>'}
    <p class="muted small">الدفع الفعلي يتم خارج المنصة (CCP/Flexy…) حسب الاتفاق — زر التأكيد يوثّق فقط ما حدث فعلاً بطريقته ومرجعه.</p></div>`;
  $$('[data-spaid]', box).forEach((b) => b.addEventListener('click', async () => {
    const id = b.dataset.spaid;
    try { await api(`/api/admin/settlements/${id}/action`, { method: 'POST', body: { action: 'paid', method: $('#sm-' + id).value, reference: $('#sr-' + id).value } }); toast('وُثّق دفع التسوية'); render(); }
    catch (e) { toast(e.message, true); }
  }));
  $$('[data-sreject]', box).forEach((b) => b.addEventListener('click', async () => {
    try { await api(`/api/admin/settlements/${b.dataset.sreject}/action`, { method: 'POST', body: { action: 'rejected', note: 'رفضته الإدارة' } }); toast('رُفضت التسوية'); render(); }
    catch (e) { toast(e.message, true); }
  }));
}

async function renderIntegrations(box) {
  const [integ, notifs] = await Promise.all([api('/api/admin/integrations'), api('/api/admin/notifications')]);
  box.innerHTML = `<div class="card"><h3>حالة التكاملات</h3>
    ${Object.entries(integ.integrations).map(([k, v]) => `<p><strong>${esc(k)}</strong>: ${v.configured ? '✅ مضبوط' : '⚠️ غير مضبوط'} — ${esc(v.note)}<br><span class="muted small">فاشلة/في الطابور: ${v.failedCount}${v.last ? ' · آخر محاولة: ' + esc(v.last.status) : ''}</span></p>`).join('')}
    <h4>الإشعارات الأخيرة</h4>${notifs.notifications.slice(0, 15).map((n) => `<p class="small">#${n.id} ${esc(n.channel)} · ${esc(n.type)} · ${esc(n.status)} · محاولات ${n.attempts}${n.last_error ? ' · ' + esc(n.last_error) : ''} <button class="btn small light" data-retry="${n.id}">إعادة المحاولة</button></p>`).join('')}</div>`;
  $$('[data-retry]', box).forEach((b) => b.addEventListener('click', async () => {
    try { const r = await api(`/api/admin/notifications/${b.dataset.retry}/retry`, { method: 'POST', body: {} }); toast(r.ok ? 'أُعيدت المحاولة بنجاح' : 'ما زالت غير مُرسلة — راجع الإعداد', !r.ok); render(); }
    catch (e) { toast(e.message, true); }
  }));
}

async function renderSupport(box) {
  const { messages } = await api('/api/admin/support');
  box.innerHTML = `<div class="card"><h3>رسائل الدعم</h3>${messages.length ? messages.map((m) => `<p><strong>${esc(m.name)}</strong> (${esc(m.phone)}): ${esc(m.message)}</p>`).join('') : '<p class="muted">لا رسائل.</p>'}</div>`;
}

async function renderTools(box) {
  const auditL = await api('/api/admin/audit');
  box.innerHTML = `<div class="card"><h3>أدوات</h3>
    <form id="catForm" class="row-form"><input id="catName" placeholder="تصنيف جديد"><button class="btn" type="submit">إضافة تصنيف</button></form>
    <p><button class="btn light" id="backupBtn" type="button">إنشاء نسخة احتياطية من قاعدة البيانات</button></p>
    <details><summary>سجل العمليات الإدارية (تدقيق)</summary>${auditL.logs.slice(0, 40).map((l) => `<p class="small">#${l.id} ${esc(l.action)} · ${esc(l.entity || '')} ${esc(l.entity_id || '')} · ${new Date(l.created_at).toLocaleString('ar-DZ')}</p>`).join('')}</details>
  </div>`;
  $('#catForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try { await api('/api/admin/categories', { method: 'POST', body: { name: $('#catName').value } }); toast('أُضيف التصنيف'); render(); }
    catch (e) { toast(e.message, true); }
  });
  $('#backupBtn').addEventListener('click', async () => {
    try { const r = await api('/api/admin/backup', { method: 'POST', body: {} }); toast('أُنشئت النسخة: ' + r.file); }
    catch (e) { toast(e.message, true); }
  });
}

// الدخول والخروج
$('#aLoginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#aLoginErr').textContent = '';
  try {
    const r = await api('/api/auth/login', { method: 'POST', body: { phone: $('#aPhone').value, password: $('#aPass').value } });
    if (!r.user || r.user.role !== 'admin') {
      await api('/api/auth/logout', { method: 'POST', body: {} }).catch(() => {});
      $('#aLoginErr').textContent = 'هذا الحساب ليس حساب إدارة — واجهة الإدارة خاصة بصاحب المنصة.';
      return;
    }
    CSRF = r.csrf;
    boot(r.user);
  } catch (err) { $('#aLoginErr').textContent = err.message; }
});
$('#aLogout').addEventListener('click', async () => {
  await api('/api/auth/logout', { method: 'POST', body: {} }).catch(() => {});
  location.reload();
});
function boot(user) {
  $('#aWho').textContent = user.name + ' · ' + user.phone;
  $('#adminLogin').hidden = true;
  $('#adminApp').hidden = false;
  render();
}
(async () => {
  try {
